<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&amp;display=swap" rel="stylesheet">
        <script src="script.js" defer></script>
        <title>Audio Player</title>
    </head>

    <body>
        <nav class="navbar">
            <img src="images/MusicIcon.png" alt="Purple music logo with a play button and audio menu" class="webIcon">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="songs.html">Songs</a></li>
            </ul>
            <div class="headerText">
                ▣- Audio Player 3001 -▣ Upload and play your own kinds of audio!
            </div>
                
        </nav>

        <div class="trackDetails">
            <h1 id="songTitle">Your Selected Song Plays Here</h1>
            <button id="favoriteButton" onclick="favorites">♡ Favorite</button>
            <audio id="audioPlayer" src="" controls>
                    Your browser does not support the audio element. <!--Text used for browsers who don't support the audio element-->
            </audio>
        </div>
        

        <div class="trackUpload">
            <label for="audioFile">Upload an audio (MP3) File: </label>
            <input type="file" id="audioFile" name="audio" accept="audio/*" />
            <!--Input needs a label to function correctly. This isn't always the case, and only applies for certain input types, with file being one of them.-->
        </div>

        <div>
            <p>Hello this is where favorites list will go</p>
            <ul id="favoritesList">
                <!-- Favorite songs will be listed here -->
        </div>
        
    </body>


</html>
